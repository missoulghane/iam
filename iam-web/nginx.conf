server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy to the backend service (Docker network DNS name).
    # Keeps frontend and API on the same browser-facing origin, so no
    # CORS configuration is needed on the Spring Boot side.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uncomment to expose Swagger UI / OpenAPI docs through the same origin.
    # location ~ ^/(swagger-ui|v3/api-docs) {
    #     proxy_pass http://backend:8080;
    #     proxy_set_header Host $host;
    # }

    # React Router (SPA) — serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
