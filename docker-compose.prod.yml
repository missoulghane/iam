# Production overlay for a VPS deployment.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The database and backend stay off the host network entirely (reachable
# only inside the iam-network Docker network) — the frontend's Nginx
# is the single public entry point, proxying /api to the backend.

services:
  backend:
    build:
      target: runtime

  frontend:
    build:
      target: runtime
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
